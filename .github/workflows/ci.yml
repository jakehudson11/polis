# =============================================================================
# Polis CI — single-arch (linux/amd64) image build/push to GHCR
#
# Trigger: push to main. Builds and pushes linux/amd64 images:
#   ghcr.io/jakehudson11/polis-server    (./server, node:24-alpine)
#   ghcr.io/jakehudson11/polis-math      (./math, clojure:temurin-17)
#   ghcr.io/jakehudson11/polis-delphi    (./delphi, python 3.12 + torch CPU)
#
# The deployment VM is x86_64 (Ubuntu, Hetzner) and every container it runs is
# amd64/linux, so images are built for linux/amd64 only. README-prod.md offers an
# ARM (CAX41) VM as one option, but the host actually in use is x86_64; if it is
# ever moved to arm64, re-add linux/arm64 to the platforms: of all three build
# steps here AND in the agora repo's ci.yml.
#
# NOTE: polis-delphi still compiles hdbscan from source for amd64, so it remains
# the slowest of the three even without the arm64 leg. Build args mirror the prod compose
# (target: final, USE_CPU_TORCH=true) so CI images match `docker compose
# build` output.
# =============================================================================

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-push:
    name: build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build & push polis-server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          # The deploy VM is x86_64 (measured 2026-10-04: uname -m = x86_64, docker
          # server arch x86_64, and every running polis container reports
          # amd64/linux). The arm64 leg was consumed by nothing and was built under
          # QEMU emulation — notably polis-delphi, which compiles hdbscan from
          # source. If the deployment host is ever moved to arm64, add linux/arm64
          # back here and in agora's ci.yml together.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/jakehudson11/polis-server:${{ steps.sha.outputs.short }}
            ghcr.io/jakehudson11/polis-server:latest

      - name: Build & push polis-math
        uses: docker/build-push-action@v6
        with:
          context: ./math
          file: ./math/Dockerfile
          push: true
          # The deploy VM is x86_64 (measured 2026-10-04: uname -m = x86_64, docker
          # server arch x86_64, and every running polis container reports
          # amd64/linux). The arm64 leg was consumed by nothing and was built under
          # QEMU emulation — notably polis-delphi, which compiles hdbscan from
          # source. If the deployment host is ever moved to arm64, add linux/arm64
          # back here and in agora's ci.yml together.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/jakehudson11/polis-math:${{ steps.sha.outputs.short }}
            ghcr.io/jakehudson11/polis-math:latest

      # Slowest of the three (hdbscan compiles from source) — expected. The GHA
      # cache in this step is what keeps repeat builds of this layer cheap.
      - name: Build & push polis-delphi
        uses: docker/build-push-action@v6
        with:
          context: ./delphi
          file: ./delphi/Dockerfile
          target: final
          build-args: |
            USE_CPU_TORCH=true
          push: true
          # The deploy VM is x86_64 (measured 2026-10-04: uname -m = x86_64, docker
          # server arch x86_64, and every running polis container reports
          # amd64/linux). The arm64 leg was consumed by nothing and was built under
          # QEMU emulation — notably polis-delphi, which compiles hdbscan from
          # source. If the deployment host is ever moved to arm64, add linux/arm64
          # back here and in agora's ci.yml together.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/jakehudson11/polis-delphi:${{ steps.sha.outputs.short }}
            ghcr.io/jakehudson11/polis-delphi:latest
